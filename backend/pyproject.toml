[project]
name = "whoop-ai-analyst"
version = "0.1.0"
description = "WHOOP 智能身体状态分析助手 —— 基于个人基线的 WHOOP 数据长期分析与 AI 解读"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "anthropic>=0.70",
    "openai>=1.40",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0"]

[project.scripts]
whoop-analyst = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["analytics/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
